<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free QR Studio — Sign in</title><style>body{font:16px system-ui;margin:0;background:#f6f7f9;color:#111}.box{max-width:420px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #ccc}button{background:#111;color:#fff;cursor:pointer}.muted{color:#666;font-size:13px}a{color:#2563eb}</style></head><body><main class="box"><h1>Account</h1><p class="muted">Authentication is handled by Supabase. Configure the public project values in this page before launch.</p><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login">Sign in</button><button id="signup">Create account</button><p id="msg" role="status"></p><p><a href="/">Back to QR Studio</a></p></main><script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let cfg={SUPABASE_URL:'',SUPABASE_ANON_KEY:''}; const msg=document.getElementById('msg');
function client(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)throw Error('Supabase public configuration is not set');return supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY)}
async function run(mode){try{await window.FQS_CONFIG_READY; cfg=window.FQS_CONFIG||cfg; const c=client(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(mode==='login'){const r=await c.auth.signInWithPassword({email,password});if(r.error)throw r.error;location.href='/dashboard.html'}else{const r=await c.auth.signUp({email,password});if(r.error)throw r.error;msg.textContent='Account created. Check your email if confirmation is enabled.'}}catch(e){msg.textContent=e.message}}
login.onclick=()=>run('login');signup.onclick=()=>run('signup');
</script></body></html>
