<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free QR Studio — Dynamic QR Dashboard</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#111}.wrap{max-width:980px;margin:5vh auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}input,button{padding:11px;border-radius:9px;border:1px solid #ccc}input{width:60%;box-sizing:border-box}button{background:#111;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #eee;padding:12px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}input{width:100%;margin-bottom:8px}}</style></head><body><main class="wrap"><div class="card"><h1>Dynamic QR Dashboard</h1><p id="who">Checking authentication…</p><input id="name" placeholder="QR name"><input id="url" type="url" placeholder="https://example.com"><button id="create">Create Dynamic QR</button><p id="msg" role="status"></p></div><div class="card"><h2>Your QR codes & analytics</h2><div id="list">Loading…</div></div><p><a href="/">QR Studio</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
let sb=null;const cfg={};let session;
async function boot(){await window.FQS_CONFIG_READY; Object.assign(cfg,window.FQS_CONFIG||{}); sb=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;if(!sb){who.textContent='Supabase public configuration is not set.';return}const s=await sb.auth.getSession();session=s.data.session;if(!session){location.href='/auth.html';return}who.textContent='Signed in as '+session.user.email;load()}async function load(){const r=await fetch('/api/analytics/summary',{headers:{Authorization:'Bearer '+session.access_token}});const d=await r.json();if(!r.ok){list.textContent=d.error||'Failed to load';return}list.innerHTML=d.qr_codes.length?d.qr_codes.map(x=>`<div class="item"><b>${esc(x.name)}</b><br>${esc(x.target_url)}<br>Scans: <strong>${x.scan_count}</strong><br><a href="/r/${x.id}" target="_blank" rel="noreferrer">Open dynamic QR URL</a></div>`).join(''):'No dynamic QR codes yet.'}async function create(){msg.textContent='';if(!session)return;const r=await fetch('/api/qr/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({name:name.value,target_url:url.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Failed';return}msg.textContent='Created: '+d.redirect_url;load()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}create.onclick=create;boot();
</script></body></html>
